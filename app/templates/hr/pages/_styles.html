<style>
.hrx h2{margin:1.6rem 0 .5rem;font-size:1.05rem;color:var(--navy,#0B1F44)}
.hrx .hrx-note{background:#F1F5F9;border-left:3px solid var(--teal,#14B8A6);padding:.6rem .9rem;border-radius:4px;color:var(--charcoal,#334155);font-size:.9rem;margin:.8rem 0}
.hrx .hrx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin:1rem 0}
.hrx .hrx-stat{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:.8rem 1rem}
.hrx .hrx-stat b{display:block;font-size:1.7rem;color:var(--navy,#0B1F44)}
.hrx .hrx-stat span{color:var(--slate,#64748B);font-size:.85rem}
.hrx table.hrx-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #E2E8F0;font-size:.92rem}
.hrx .hrx-table th{text-align:left;background:#F8FAFC;color:var(--slate,#64748B);font-weight:600;padding:.55rem .7rem;font-size:.8rem}
.hrx .hrx-table td{padding:.55rem .7rem;border-top:1px solid #EEF2F7;vertical-align:top}
.hrx .hrx-wrap{overflow-x:auto}
.hrx .hrx-pill{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.78rem;background:#E2E8F0;color:#334155}
.hrx .hrx-pill.ok{background:#CCFBF1;color:#0F766E}.hrx .hrx-pill.warn{background:#FEF3C7;color:#92400E}.hrx .hrx-pill.off{background:#FEE2E2;color:#991B1B}
.hrx form.hrx-filter{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
.hrx input[type=text],.hrx input[type=date],.hrx select,.hrx textarea{padding:.45rem .6rem;border:1px solid #CBD5E1;border-radius:6px;font:inherit;max-width:100%}
.hrx textarea{width:100%;min-height:6rem}
.hrx .hrx-btn{background:var(--indigo,#6366F1);color:#fff;border:0;border-radius:6px;padding:.5rem .9rem;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.hrx .hrx-btn.sec{background:#fff;color:var(--navy,#0B1F44);border:1px solid #CBD5E1}.hrx .hrx-btn.danger{background:#B91C1C}
.hrx .hrx-card{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:1rem;margin:.8rem 0}
.hrx .hrx-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.3rem}
.hrx .hrx-muted{color:var(--slate,#64748B)}
</style>
